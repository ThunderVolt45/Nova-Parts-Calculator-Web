name: 버그 신고
description: 계산, 덱, 로컬 파일 또는 3D 기능의 재현 가능한 문제를 알려 주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        신고 내용은 공개됩니다. 개인정보, 게임 설치 경로, 계정 정보, GX·XFI·텍스처 등 게임 원본 파일은 첨부하지 마세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 어떤 기능에서 무엇이 잘못되었는지 간단히 설명해 주세요.
      placeholder: 예) 멀티샷건 특수 효과를 켜면 공격력이 예상과 다르게 표시됩니다.
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: 문제 영역
      options:
        - 부품 선택 및 강화
        - 능력치 계산 및 시뮬레이션
        - 덱 저장 및 JSON 가져오기·내보내기
        - 로컬 GX·XFI 파일 연결 및 캐시
        - 3D 모델 및 애니메이션
        - 모바일 화면 및 접근성
        - 기타
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제, 브라우저와 버전, PC·모바일 여부를 적어 주세요.
      placeholder: Windows 11 / Chrome 140 / PC
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있도록 시작 상태부터 순서대로 적어 주세요.
      placeholder: |
        1. 다리 선택에서 토들러N을 선택합니다.
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      description: 정상이라면 어떤 결과가 나와야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 표시된 값, 오류 문구 또는 화면 상태를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: 관련 구성 정보
      description: 필요한 경우 부품 ID, 강화 수치, 서브코어, 활성화한 효과를 적어 주세요. 원본 게임 파일은 첨부하지 마세요.
      placeholder: 다리 ID / 몸통 ID / 무기 ID / 액세서리 ID / 강화 및 시뮬레이션 설정

  - type: textarea
    id: additional
    attributes:
      label: 추가 자료
      description: 개인정보나 게임 원본 파일이 포함되지 않은 스크린샷 또는 추가 설명이 있다면 첨부해 주세요.

  - type: checkboxes
    id: safety
    attributes:
      label: 공개 정보 확인
      options:
        - label: 개인정보, 게임 설치 경로와 GX·XFI·텍스처 등 게임 원본 파일을 포함하지 않았습니다.
          required: true
